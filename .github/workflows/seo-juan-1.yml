name: SEO Juan 1

on:
  push:
    paths:
      - '.github/workflows/seo-juan-1.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Aplicar cambios SEO en inicio
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('docs/index.html')
          text = path.read_text(encoding='utf-8')

          replacements = {
              'Arreglos con alma editorial.': 'Arreglos florales artísticos en Zapopan.',
              'Un carrusel visual para mantener el dinamismo de la página y mostrar\n                            arreglos como\n                            si fueran parte de una campaña boutique.': 'Tenemos una gran variedad de flores como rosas, tulipanes, girasoles y otras opciones de temporada para crear arreglos únicos.',
              'Floristería Juan H Magno': 'Floristería Magno',
              'Floristeria Magno': 'Floristería Magno',
          }

          for old, new in replacements.items():
              if old not in text:
                  raise RuntimeError(f'No se encontró el texto esperado: {old}')
              text = text.replace(old, new)

          old_delivery = '''                            <p class="text-muted-custom mb-0">
                                Para entregas el mismo día, confirma disponibilidad de flores, horarios y zona por
                                WhatsApp.
                            </p>'''

          new_delivery = '''                            <p class="text-muted-custom mb-3">
                                Para entregas el mismo día, confirma disponibilidad de flores, horarios y zona por
                                WhatsApp.
                            </p>
                            <p class="text-muted-custom mb-0">
                                Realizamos entregas de flores a domicilio en Guadalajara, Zapopan, San Pedro Tlaquepaque,
                                Tonalá, Tlajomulco de Zúñiga, El Salto, Juanacatlán, Ixtlahuacán de los Membrillos y
                                Zapotlanejo.
                            </p>'''

          if old_delivery not in text:
              raise RuntimeError('No se encontró el bloque de entregas esperado')

          text = text.replace(old_delivery, new_delivery, 1)
          path.write_text(text, encoding='utf-8')
          PY

          rm -f .github/workflows/seo-juan-1.yml

      - name: Push
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A docs/index.html .github/workflows/seo-juan-1.yml
          git commit -m "SEO Juan 1"
          git push

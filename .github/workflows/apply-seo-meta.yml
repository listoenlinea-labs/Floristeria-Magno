name: Apply SEO metadata

on:
  push:
    paths:
      - '.github/scripts/apply-seo.py'
      - '.github/workflows/apply-seo-meta.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply SEO changes
        run: python .github/scripts/apply-seo.py

      - name: Commit changes
        run: |
          rm -f .github/scripts/apply-seo.py
          rm -f .github/workflows/apply-seo-meta.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Agregar metadatos SEO y noindex a paginas internas"
          git push
